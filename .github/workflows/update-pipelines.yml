name: Update README pipeline status

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/render_pipelines.py"
      - ".github/workflows/update-pipelines.yml"

permissions:
  contents: write

concurrency:
  group: update-pipelines
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render pipeline status section
        env:
          GH_TOKEN: ${{ secrets.ORG_README_PAT }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Secret ORG_README_PAT is not set. It must be a PAT with org-wide read access (Metadata: Read, Actions: Read on all org repos)."
            exit 1
          fi
          python3 .github/scripts/render_pipelines.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet README.md; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh pipeline status section"
          git push
